################################################################
# CorpAI — Stack LOCAL reduzida para testes em localhost.
#
# Sobe apenas o necessário para exercitar o pipeline RAG:
#   postgres + redis + chromadb + corpai-backend + corpai-frontend
#
# Ollama NÃO roda em container: usa o Ollama nativo do host
# (modelos qwen2.5:7b e nomic-embed-text já baixados). O backend
# o acessa via host.docker.internal:11434.
#
# Uso:
#   docker compose -f docker-compose.local.yml up -d --build
#   docker compose -f docker-compose.local.yml logs -f corpai-backend
#   docker compose -f docker-compose.local.yml down
#
# Acesso:
#   Frontend : http://localhost:3001
#   API/docs : http://localhost:8080/api/docs
################################################################

services:

  postgres:
    image: postgres:16-alpine
    container_name: corpai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - corpai-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: corpai-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - corpai-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:0.6.3
    container_name: corpai-chromadb
    restart: unless-stopped
    environment:
      - CHROMA_SERVER_AUTHN_PROVIDER=chromadb.auth.token_authn.TokenAuthenticationServerProvider
      - CHROMA_SERVER_AUTHN_CREDENTIALS=${CHROMA_AUTH_TOKEN}
      - CHROMA_SERVER_AUTHN_TOKEN_TRANSPORT_HEADER=Authorization
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - corpai-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v2/heartbeat || curl -sf http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 5

  corpai-backend:
    build:
      context: ./corpai-backend
      dockerfile: Dockerfile
    container_name: corpai-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"     # API exposta direto em localhost p/ testes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Ollama NATIVO do host (modelos já baixados)
      OLLAMA_HOST: host.docker.internal
      OLLAMA_PORT: 11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      CHROMA_AUTH_TOKEN: ${CHROMA_AUTH_TOKEN}
      SECRET_KEY: ${CORPAI_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${CORPAI_ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${CORPAI_REFRESH_TOKEN_EXPIRE_DAYS}
      ADMIN_USERNAME: ${CORPAI_ADMIN_USERNAME}
      ADMIN_PASSWORD: ${CORPAI_ADMIN_PASSWORD}
    volumes:
      - images_data:/data/images   # imagens da base (servidas só via endpoint autenticado)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    networks:
      - corpai-net

  corpai-frontend:
    build:
      context: ./corpai-frontend
      dockerfile: Dockerfile
    container_name: corpai-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - corpai-backend
    networks:
      - corpai-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  chroma_data:
    driver: local
  images_data:
    driver: local

networks:
  corpai-net:
    driver: bridge
    name: corpai-net
