         Orbitron        → wordmark/marca, exclusivamente
         Source Serif 4  → display grande (manifesto, headings de seção)
         Space Grotesk   → títulos de componentes/cards
         Martian Mono    → labels técnicos, eyebrows, numeração
         Atkinson H. Next→ corpo, UI, formulários (hyperlegible)
         JetBrains Mono  → código (chat/markdown), não é UI
         Manrope 800     → exclusivamente o "liminai" gigante do hero -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600&family=Space+Grotesk:wght@500;600;700&family=Martian+Mono:wght@400;500;600&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&family=Manrope:wght@800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
