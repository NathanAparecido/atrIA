# Stack TOTALMENTE INDEPENDENTE do corpai/liminai:
# - Sem postgres, sem redis, sem ollama, sem corpai-net
# - Docker Compose cria uma rede default isolada apenas para este projeto
# - Fontes uploadadas persistem em ./font-preview-data/fonts no host
services:
  font-preview:
    build: ./font-preview-backend
    container_name: font_preview_site
    ports:
      - "8080:80"
    volumes:
      - ./font-preview.html:/app/public/index.html:ro
      - ./font-preview-data/fonts:/data/fonts
    restart: unless-stopped
